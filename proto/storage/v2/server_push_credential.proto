syntax = "proto3";
package com.latenighthack.lockers.server.storage.v2;
option java_package = "com.latenighthack.lockers.server.storage.v2";

// Retains revision history after unregister to reject delayed credentials.
message ServerPushCredential {
  bytes key = 1;
  bytes session_id = 2;
  int32 backend = 3;
  int64 revision = 4;
  bytes payload_digest = 5;
  bool registered = 6;
  bool invalidated = 7;
}
