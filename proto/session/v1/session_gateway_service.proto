syntax = "proto3";

package com.latenighthack.lockers.session.v1;

option java_package = "com.latenighthack.lockers.session.v1";

import "common/v1/model.proto";

service SessionGateway {
    rpc PostEvents(PostEventsRequest) returns (PostEventsResponse);
    rpc PostEvent(PostEventRequest) returns (PostEventResponse);
}

message PostEventRequest {
    repeated common.v1.SessionId session_ids = 1;
    common.v1.Event event = 2;
}

message PostEventResponse {
    Result result = 1;
    enum Result {
        OK = 0;
        RETRY_ROUTING = 1;
        INVALID = 2;
        UNKNOWN_SESSION = 3;
        RESOURCE_EXHAUSTED = 4;
        UNKNOWN_ERROR = 10;
    }
}

// Groups are ordered; each response means the group's inbox inserts are durable.
message PostEventsRequest { repeated PostEventRequest groups = 1; }
message PostEventsResponse { repeated PostEventResponse results = 1; }
