name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      # Real Postgres for the claim-ownership SQL tests (ON CONFLICT/WHERE semantics are the
      # product; H2/SQLite substitutes are not acceptable there). LOCKERS_TEST_PG_REQUIRED makes
      # an unset URL a hard failure in CI so these suites can never silently skip.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lockers
          POSTGRES_PASSWORD: lockers
          POSTGRES_DB: lockers
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build :observability-server:monitoringBundle
        env:
          LOCKERS_TEST_PG_URL: jdbc:postgresql://localhost:5432/lockers?user=lockers&password=lockers
          LOCKERS_TEST_PG_REQUIRED: 'true'

      - name: Upload versioned monitoring bundle
        uses: actions/upload-artifact@v4
        with:
          name: lockers-monitoring
          path: observability-server/build/distributions/*.zip

      - name: Static analysis (detekt, advisory)
        run: ./gradlew detekt

  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check portable dashboard artifacts
        run: python3 monitoring/tools/generate.py --check
      - name: Start pinned monitoring smoke stack
        run: docker compose -f monitoring/smoke/compose.yml up -d
      - name: Validate import, queries, alerts and correlation
        run: python3 monitoring/smoke/verify.py
      - name: Clean up smoke stack
        if: always()
        run: docker compose -f monitoring/smoke/compose.yml down -v

  publish:
    # Publishes :api and :connector to Maven Central. Runs on macOS because the
    # iOS Kotlin/Native targets can only be compiled there — an ubuntu run would
    # silently skip them and publish an incomplete artifact set.
    # main push  -> optional "<baseVersion>-SNAPSHOT" (Central snapshot repo)
    # Enable snapshots for the namespace in Central first, then set the repository
    # variable CENTRAL_SNAPSHOTS_ENABLED=true. Releases need no snapshot permission.
    # v* tag     -> release <version> (auto-promoted on the Central Portal)
    needs: [build, monitoring]
    if: github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/v') || (github.ref == 'refs/heads/main' && vars.CENTRAL_SNAPSHOTS_ENABLED == 'true'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Publish to Maven Central
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache
