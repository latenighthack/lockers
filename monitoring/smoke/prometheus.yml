global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files: [/etc/prometheus/lockers-alerts/lockers.yml]
scrape_configs:
  - job_name: lockers-sample
    static_configs: [{targets: [fixture:8080]}]
  - job_name: lockers-sample-replica
    metrics_path: /replica
    static_configs: [{targets: [fixture:8080]}]
