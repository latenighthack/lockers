name: lockers-monitoring-smoke
services:
  fixture:
    image: python:3.13-alpine
    command: [python, /work/smoke/fixture.py]
    volumes:
      - ../:/work:ro
  prometheus:
    image: prom/prometheus:v3.2.1
    command: [--config.file=/etc/prometheus/prometheus.yml]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../alerts:/etc/prometheus/lockers-alerts:ro
    ports: ["127.0.0.1::9090"]
  loki:
    image: grafana/loki:3.3.2
    command: [-config.file=/etc/loki/local-config.yaml]
    ports: ["127.0.0.1::3100"]
  tempo:
    image: grafana/tempo:2.6.1
    command: [-config.file=/etc/tempo.yml]
    volumes: ["./tempo.yml:/etc/tempo.yml:ro"]
    ports: ["127.0.0.1::3200", "127.0.0.1::4318"]
  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_BASIC_ENABLED: "false"
    volumes:
      - ../dashboards:/etc/grafana/lockers:ro
      - ../provisioning/dashboards.yml:/etc/grafana/provisioning/dashboards/lockers.yml:ro
      - ./datasources.yml:/etc/grafana/provisioning/datasources/monitoring.yml:ro
    ports: ["127.0.0.1::3000"]
